name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# macos-15 ships Xcode 16.0 through 16.4 and 26.x side by side. Pin one so the Swift
# version does not change under us. Xcode 16.4 has Swift 6.1 and Swift Testing.
env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --enable-code-coverage
      - name: Build the app bundle
        run: scripts/build-app.sh dist
      - name: Smoke test the app bundle
        run: scripts/smoke-test.sh dist/TallyBar.app

  lint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict
