name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --enable-code-coverage
      - name: Build the app bundle
        run: scripts/build-app.sh dist
      - name: Smoke test the app bundle
        run: scripts/smoke-test.sh dist/TallyBar.app
