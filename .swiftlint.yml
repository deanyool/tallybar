included:
  - Sources
  - Tests
excluded:
  - .build
line_length:
  warning: 140
  error: 200
  ignores_comments: true
identifier_name:
  min_length: 2
  excluded:
    - id
large_tuple:
  warning: 4
  error: 6
function_parameter_count:
  warning: 7
  error: 10
type_body_length:
  warning: 400
  error: 700
file_length:
  warning: 600
  error: 1000
function_body_length:
  warning: 60
  error: 120
cyclomatic_complexity:
  warning: 12
  error: 20
opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - toggle_bool
  - unused_declaration
